name: Fill author institutions

on:
  push:
    branches: [main]
    paths: [papers.json]
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query OpenAlex for missing institutions
        run: python scripts/enrich.py
      - name: Commit changes
        run: |
          if git diff --quiet papers.json; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name "lit-radar-bot"
          git config user.email "lit-radar-bot@users.noreply.github.com"
          git add papers.json
          git commit -m "Fill author institutions from OpenAlex"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
