name: MT quality test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: "Qwen/Qwen2.5-1.5B-Instruct-GGUF", file: "qwen2.5-1.5b-instruct-q4_k_m.gguf" }
          - { repo: "Qwen/Qwen2.5-3B-Instruct-GGUF", file: "qwen2.5-3b-instruct-q4_k_m.gguf" }
          - { repo: "Qwen/Qwen2.5-7B-Instruct-GGUF", file: "qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf" }
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp
        run: |
          git clone -q --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama
          cmake -S /tmp/llama -B /tmp/llama/build -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build /tmp/llama/build --target llama-server -j4 > /dev/null
          find /tmp/llama/build -name llama-server -type f | head -1 > /tmp/srv && cat /tmp/srv
      - name: model
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import hf_hub_download as d; import sys; r='${{ matrix.repo }}'; f='${{ matrix.file }}'; p=d(r,f,local_dir='/tmp/m'); print(p)
          if '00001-of' in f: d(r,f.replace('00001-of','00002-of'),local_dir='/tmp/m')"
      - name: test
        run: |
          S=$(cat /tmp/srv); chmod +x $S; nproc
          LD_LIBRARY_PATH=$(dirname $S) $S -m /tmp/m/${{ matrix.file }} -c 8192 --parallel 4 -t 4 --port 8080 > /tmp/srv.log 2>&1 &
          for i in $(seq 1 120); do curl -s localhost:8080/health | grep -q ok && break; sleep 2; done
          python scripts/mt_test2.py ${{ matrix.file }} || tail -30 /tmp/srv.log
