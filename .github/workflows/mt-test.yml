name: MT quality test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers sentencepiece sacremoses
      - run: nproc && python scripts/mt_test.py
