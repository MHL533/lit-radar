<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>科研文献查询器</title>
<script>try{var t=JSON.parse(localStorage.getItem("lr-theme")||'"system"');if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Layout: filter sidebar on the left (drawer on phones); main column with search bar and results as cards or list rows. */
:root{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17232b; --muted:#5b6b75; --line:#dbe2e6; --soft:#eef2f4;
  --accent:#1f5f7a; --accent-soft:#e3eef3; --on-accent:#ffffff;
  --z1:#7a2e1f; --z1-soft:#f6e6e1; --z2:#5a5a1f; --z2-soft:#efefdc;
  --if:#2f4b7c; --if-soft:#e5ebf5;
  --star:#b8860b; --scrim:rgba(15,23,28,.45);
  --f-display:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171c; --surface:#172129; --fg:#e3eaee; --muted:#93a3ad; --line:#26333c; --soft:#1c2830;
  --accent:#7cbfdc; --accent-soft:#1c3340; --on-accent:#0d1a20;
  --z1:#f0a28f; --z1-soft:#3a2420; --z2:#d6d68a; --z2-soft:#2f2f1c;
  --if:#a9c1ec; --if-soft:#1f2a3d; --star:#e6b84a; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#172129; --fg:#e3eaee; --muted:#93a3ad; --line:#26333c; --soft:#1c2830;
  --accent:#7cbfdc; --accent-soft:#1c3340; --on-accent:#0d1a20;
  --z1:#f0a28f; --z1-soft:#3a2420; --z2:#d6d68a; --z2-soft:#2f2f1c;
  --if:#a9c1ec; --if-soft:#1f2a3d; --star:#e6b84a; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:62ch}
.headr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.stats b{color:var(--fg);font-weight:600}
.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:focus-visible,.chip:focus-visible,.act:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:16px;align-content:start}
.sidehead{display:flex;align-items:center;gap:8px}
.sidehead h2{font-size:15px;margin:0;flex:1}
.fsec{display:grid;gap:6px;min-width:0}
.fsec h3{font-size:12px;color:var(--muted);margin:0;font-weight:600;letter-spacing:.06em}
.fsec select,.fsec input{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips select{flex:1 1 100%}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topbar>*{min-width:0}
#openSide,.closeSide{display:none}
.collapseSide{padding:4px 8px;font-size:12px}
.layout.collapsed{grid-template-columns:minmax(0,1fr)}
.layout.collapsed .side{display:none}
.layout.collapsed #openSide{display:inline-flex}
.sideScrim{position:fixed;inset:0;background:var(--scrim);z-index:25}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);max-height:none;border-radius:0;border-width:0 1px 0 0;z-index:30;transform:translateX(-104%);transition:transform .2s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  #openSide,.closeSide{display:inline-flex}
  .collapseSide{display:none}
  .layout.collapsed .side{display:grid}
}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.row .lab{font-size:12px;color:var(--muted);min-width:3.2em}
input[type=search],input[type=text],input[type=email],input[type=password],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0}
input[type=search]{flex:1 1 220px}
select{max-width:100%;text-overflow:ellipsis}
.seg{flex:none}
.inst{flex:1 1 220px}
.chip{font:inherit;font-size:13px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:5px 10px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg svg{width:15px;height:15px;fill:currentColor}
.count{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.seglab{font-size:12px;color:var(--muted);padding:0 8px;display:inline-flex;align-items:center;background:var(--soft);border-right:1px solid var(--line)}
.sortseg button{min-width:3.5em;justify-content:center}
.badge{font-size:11px;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 6px;margin-left:2px}
.clear{font:inherit;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* cards */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}
@media (min-width:901px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid article.card{padding:12px 13px;gap:5px}
  .grid h3{font-size:14.5px}
  .grid .sum{font-size:13px}
  .grid .foot{flex-direction:column;align-items:stretch}
  .grid .foot .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
  .grid .foot .doi{overflow-wrap:normal}
}
article.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
article.card.read,.lrow.read{opacity:.6}
.meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap}
.z1{background:var(--z1-soft);color:var(--z1)}
.z2{background:var(--z2-soft);color:var(--z2)}
.iftag{background:var(--if-soft);color:var(--if)}
.key{font-size:11px;font-weight:600;color:var(--star);border:1px solid var(--star);border-radius:4px;padding:0 6px;white-space:nowrap}
.field{color:var(--accent);font-weight:600}
.journal{font-style:italic;color:var(--fg)}
.date{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.4;margin:0;overflow-wrap:anywhere}
h3 a{color:inherit;text-decoration:none}
h3 a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sum{margin:0;font-size:14px}
.aff{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.aff b{font-weight:600;color:var(--fg)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.foot a{color:var(--muted)}
.doi{font-family:var(--f-mono);overflow-wrap:anywhere}
.acts{display:flex;gap:4px}
.act{font:inherit;font-size:12px;padding:2px 9px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.act.on{color:var(--star);border-color:var(--star)}
/* list */
.tzh{margin:2px 0 0;font-size:13.5px;line-height:1.5;color:var(--fg);font-family:var(--f-body);font-weight:500}
.au{margin:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.absbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:5px;padding:2px 8px;cursor:pointer}
.abs{margin-top:6px;padding:10px 12px;background:var(--soft);border-radius:6px;font-size:13px;line-height:1.65}
.abs h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.abs p{margin:0 0 8px}.abs p:last-child{margin:0}.abs .en{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.lrow .tz{font-size:12.5px;color:var(--fg);margin-top:2px}
.kws{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:11.5px}
.kws button{font:inherit;border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.kws button:hover{color:var(--accent)}
.sortseg[hidden],.tip[hidden]{display:none}
.exp{position:relative}
.exp summary{list-style:none}
.exp summary::-webkit-details-marker{display:none}
.exp .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:6px;min-width:250px;display:flex;flex-direction:column;gap:2px}
.exp .menu button{font:inherit;font-size:13px;text-align:left;border:0;background:none;color:var(--fg);padding:7px 10px;border-radius:6px;cursor:pointer}
.exp .menu button:hover{background:var(--soft)}
.exp .menu small{display:block;color:var(--muted);font-size:11.5px;padding:4px 10px 2px}
.viz{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 2px;font-size:14px}
.panel .sub{margin:0 0 10px;color:var(--muted);font-size:12px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-t{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .bar{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar,.chart .bar.on{fill:var(--fg)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:3;font-variant-numeric:tabular-nums}
.tip[hidden]{display:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.hbars{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 92px 46px;gap:8px;align-items:center;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:3px 4px;border-radius:5px;cursor:pointer}
.hb:hover{background:var(--soft)}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hb .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.graphbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.graphbar select{width:auto}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%}
.lg i.f{background:var(--accent)}
.lg i.k{background:var(--surface);border:1.5px solid var(--muted)}
.graph svg{display:block;width:100%;height:auto;touch-action:none}
.graph .ed{stroke:var(--muted);fill:none}
.graph .nd{cursor:pointer}
.graph .nd circle.f{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.graph .nd circle.k{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.graph .nd text{fill:var(--fg);font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.graph .nd text.f{font-weight:600}
.graph.focus .ed:not(.on){opacity:.06}
.graph.focus .nd:not(.on){opacity:.25}
.pairs{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.pairs b{color:var(--fg);font-weight:500}
.list{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.lrow{display:grid;grid-template-columns:86px 104px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.lrow:first-child{border-top:0}
.lrow .t{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.lrow .t a{color:inherit;text-decoration:none}
.lrow .t a:hover{color:var(--accent);text-decoration:underline}
.lrow .s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.lrow .tags{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:640px){
  .lrow{grid-template-columns:1fr auto}
  .lrow .date,.lrow .tags{grid-column:1/-1;display:flex;gap:6px}
  .headr{align-items:flex-start}
  .stats{justify-content:flex-start}
}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;margin-top:20px;color:var(--muted);font-size:14px}
.empty strong{color:var(--fg);display:block;font-size:15px;margin-bottom:6px}
.more{display:flex;justify-content:center;margin-top:16px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
/* login dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border-radius:10px;border:1px solid var(--line);width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:12px}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dlg textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%;resize:vertical;min-height:110px}
.dlg select{width:100%}
.fbpaper{font-size:12px!important;background:var(--soft);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
a.btn{text-decoration:none}
.dlg h2{margin:0;font-family:var(--f-display);font-size:19px}
.dlg p{margin:0;font-size:13px;color:var(--muted)}
.dlg label{font-size:13px;display:grid;gap:4px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px}
.profiles{display:flex;flex-wrap:wrap;gap:6px}
.login-methods{display:flex;flex-wrap:wrap;gap:6px}
#smsForm{display:grid;gap:8px}
#smsForm input{width:100%}
#smsSend{justify-self:start}
.dlg .row{justify-content:flex-end}
.dlg input[type=email],.dlg input[type=password],.dlg input[type=text]{width:100%}
.fgroup{display:grid;gap:4px;margin-bottom:8px}
.glab{font-size:12px;color:var(--muted);font-weight:600}
.msg{min-height:1.2em;color:var(--z1)!important}
#authTabs{justify-self:start}
#scope{flex:0 1 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>科研文献查询器</h1>
      <p class="sub" id="subline">中科院分区 1–2 区期刊论文，2020 年至今，按研究领域每天自动更新</p>
    </div>
    <div class="headr">
      <div class="hbtns">
        <div class="seg" id="themeSeg" role="group" aria-label="主题">
          <button type="button" data-t="system" title="跟随系统设置">跟随系统</button>
          <button type="button" data-t="light" title="浅色主题">浅色</button>
          <button type="button" data-t="dark" title="暗色主题">暗色</button>
        </div>
        <button class="btn" id="fbBtn" type="button">反馈</button>
        <button class="btn" id="loginBtn" type="button">登录</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="side" id="side" aria-label="筛选条件">
      <div class="sidehead">
        <h2>筛选</h2>
        <button class="clear" id="reset" type="button">清除筛选</button>
        <button class="btn collapseSide" id="collapseSide" type="button" title="收起筛选栏" aria-controls="side"><svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" fill="currentColor"><path d="M10.5 2.5 5 8l5.5 5.5 1.1-1.1L7.2 8l4.4-4.4z"/></svg>收起</button>
        <button class="btn closeSide" id="closeSide" type="button">完成</button>
      </div>
      <section class="fsec">
        <h3>领域与方向</h3>
        <select id="scope" aria-label="选择领域"></select>
        <div class="chips" id="fieldRow" role="group" aria-label="研究方向"></div>
      </section>
      <section class="fsec">
        <h3>上线日期</h3>
        <div class="chips" id="dateRow" role="group" aria-label="日期范围">
          <select id="month" aria-label="按月份筛选"><option value="">按月份</option></select>
        </div>
      </section>
      <section class="fsec">
        <h3>期刊来源</h3>
        <select id="journal" aria-label="期刊"><option value="">全部期刊</option></select>
        <select id="zone" aria-label="中科院分区"><option value="">全部分区</option><option value="1">中科院 1 区</option><option value="2">中科院 2 区</option></select>
      </section>
      <section class="fsec">
        <h3>发表单位</h3>
        <input type="text" id="inst" list="instList" placeholder="如 Tongji University" aria-label="发表单位">
        <datalist id="instList"></datalist>
      </section>
      <section class="fsec">
        <h3>标记</h3>
        <div class="chips">
          <button class="chip" id="keyonly" aria-pressed="false" type="button">只看重点</button>
          <button class="chip" id="staronly" aria-pressed="false" type="button">★ 收藏</button>
          <button class="chip" id="unreadonly" aria-pressed="false" type="button">未读</button>
        </div>
      </section>
    </aside>

    <main class="main">
      <div class="topbar" role="search">
        <button class="btn" id="openSide" type="button" aria-controls="side">筛选<span class="badge" id="fcount" hidden></span></button>
        <input type="search" id="q" placeholder="搜索中英文标题、关键词、作者、期刊、DOI" aria-label="搜索文献">
        <div class="seg" role="group" aria-label="显示方式">

<script>
// 文献库按“领域组/月份”分片存放在 data/ 下，按需加载。依次尝试：同站点（GitHub Pages）→ jsDelivr（国内较稳）→ GitHub 原始文件
const SOURCES = [
  "data/",
  "https://cdn.jsdelivr.net/gh/MHL533/lit-radar@main/data/",
  "https://raw.githubusercontent.com/MHL533/lit-radar/main/data/"
];
const DEFAULT_FIELDS = { "pa-nf": "聚酰胺纳滤膜", "cat-mem": "催化膜", "heo": "高熵氧化物催化", "ml-mem": "机器学习+膜" };
const PAGE = 60;
const $ = id => document.getElementById(id);
const store = {

let FIELDS = DEFAULT_FIELDS, GROUPS = [{ id: "membrane", name: "膜分离", fields: Object.keys(DEFAULT_FIELDS), default: true }], JOURNALS = {}, ALL = [];

const LOADED = new Set(), PENDING = new Map(), IDS = new Set();

/* ---------- accounts: cloud (Supabase) or local fallback ---------- */
const CFG = window.LR_CONFIG || {};
const authReturnError = (() => {
  const url = new URL(location.href);
  for (const params of [url.searchParams, new URLSearchParams(url.hash.slice(1))]){
    if (!params.has("error")) continue;
    if (params.get("error_code") === "identity_already_exists") return "此登录身份已绑定其他账户，请使用原来的登录方式。";
    if (params.get("error") === "access_denied") return "授权未完成。你可以重新授权或使用邮箱登录。";
    return "第三方授权未完成，请重新登录后再试。";
  }
  return "";
})();
const cloudConfigured = !!(CFG.supabaseUrl || CFG.supabaseAnonKey);
let sb = null;
try { if (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase) sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey); } catch {}
const auth = { user: null, profile: null, loading: !!sb };
let accountVersion = 0;
let localUsers = store.get("lr-users", {}), localCurrent = store.get("lr-current", null);
if (localCurrent && !localUsers[localCurrent]) localCurrent = null;
let marks = {};

function defaultName(user){
  const meta = user.user_metadata || {};
  return [meta.nickname, meta.name, user.email?.split("@")[0]].find(n => typeof n === "string" && n.trim()) || "研究者";
}
function who(){ return cloudConfigured ? (auth.user ? auth.profile?.nickname || defaultName(auth.user) : null) : localCurrent; }
function myFields(){
  const f = cloudConfigured ? auth.profile?.fields : (localCurrent ? localUsers[localCurrent]?.fields : null);
  return Array.isArray(f) ? f.filter(x => FIELDS[x]) : [];
}
function loadLocalMarks(){ marks = store.get("lr-marks:" + (localCurrent || "_guest"), store.get("lit-radar-marks", {})); }
async function loadCloudMarks(user){
  const { data, error } = await sb.from("marks").select("paper_id,starred,read").eq("user_id", user.id);
  if (error) throw error;
  return Object.fromEntries((data || []).map(r => [r.paper_id, { starred: r.starred, read: r.read }]));
}
async function saveMark(id, m){
  if (sb && auth.user){
    const { error } = await sb.from("marks").upsert({ user_id: auth.user.id, paper_id: id, starred: !!m.starred, read: !!m.read, updated_at: new Date().toISOString() });
    if (error) showNote("收藏同步失败：" + error.message);
  } else store.set("lr-marks:" + (cloudConfigured ? "_guest" : (localCurrent || "_guest")), marks);
}
async function loadProfile(user){
  const { data, error } = await sb.from("profiles").select("nickname,fields").eq("id", user.id).maybeSingle();
  if (error) throw error;
  if (data) return data;
  const meta = user.user_metadata || {};
  const prof = { id: user.id, nickname: defaultName(user), fields: Array.isArray(meta.fields) ? meta.fields : [] };
  const { error: saveError } = await sb.from("profiles").upsert(prof, { ignoreDuplicates: true });
  if (saveError) throw saveError;
  return prof;
}
function renderAccount(){
  applyMarks(); state.scope = who() ? "mine" : (state.scope === "mine" ? "" : state.scope);
  renderLogin(); renderScope(); reset();
}
function afterAuthChange(user = null){
  const version = ++accountVersion;
  auth.user = user; auth.profile = null; auth.loading = !!user;
  if (cloudConfigured) marks = user ? {} : store.get("lr-marks:_guest", {});
  else loadLocalMarks();
  if (!$("scrim").hidden) closeLogin();
  if (!$("fbScrim").hidden) closeFeedback();
  renderAccount();
  if (!user) return;
  // Run database queries outside the auth event's session lock.
  setTimeout(async () => {
    const [profile, savedMarks] = await Promise.allSettled([loadProfile(user), loadCloudMarks(user)]);
    if (version !== accountVersion) return;
    if (profile.status === "fulfilled") auth.profile = profile.value;
    if (savedMarks.status === "fulfilled") marks = savedMarks.value;
    auth.loading = false;
    renderAccount();
    if (profile.status === "fulfilled" && !auth.profile.fields?.length && $("scrim").hidden) openLogin();
    if (profile.status === "rejected" || savedMarks.status === "rejected") showNote("部分账户资料未能加载，请刷新页面重试。");
  }, 0);
}

/* ---------- helpers ---------- */
function zoneOf(p){ return String((JOURNALS[p.journal] || {}).cas_zone || p.cas_zone || ""); }
function ifOf(p){ const v = (JOURNALS[p.journal] || {}).if; return v == null ? null : v; }
function abbrOf(p){ return (JOURNALS[p.journal] || {}).abbr || p.journal || ""; }
function showNote(t){ const n = $("note"); n.hidden = false; n.textContent = t; }
function scopeGroups(){
  if (state.scope === "all") return GROUPS.map(g => g.id);
  if (state.scope === "mine") { const mf = new Set(myFields()); return GROUPS.filter(g => g.fields.some(f => mf.has(f))).map(g => g.id); }
  const g = GROUPS.find(x => x.id === state.scope) || GROUPS.find(x => x.default) || GROUPS[0];
  return g ? [g.id] : [];
}
function inScope(p, scope){ return p.fields.some(f => scope.has(f)); }
function scopeFields(){
  if (state.scope === "mine") return myFields();
  if (state.scope === "all") return Object.keys(FIELDS);
  const g = GROUPS.find(x => x.id === state.scope) || GROUPS.find(x => x.default) || GROUPS[0];
  return g ? g.fields : Object.keys(FIELDS);
}

/* ---------- filters UI ---------- */
function chip(label, pressed, onClick){
  const b = el("button", "chip", label); b.type = "button"; b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", onClick); return b;
}
function renderScope(){
  const s = $("scope"); s.replaceChildren();
  if (who()) s.append(new Option("我关注的方向", "mine"));
  for (const g of GROUPS) s.append(new Option(g.name, g.id));
  s.append(new Option("全部领域", "all"));
  if (![...s.options].some(o => o.value === state.scope)) state.scope = who() ? "mine" : ((GROUPS.find(x => x.default) || GROUPS[0] || {}).id || "all");
  s.value = state.scope; state.fields.clear(); renderFieldChips();
}
function renderFieldChips(){
  const row = $("fieldRow"); row.querySelectorAll(".chip").forEach(c => c.remove());
  const fs = scopeFields();
  row.append(chip("全部", state.fields.size === 0, () => { state.fields.clear(); renderFieldChips(); reset(); }));
  for (const k of fs) if (FIELDS[k])
    row.append(chip(FIELDS[k], state.fields.has(k), () => { state.fields.has(k) ? state.fields.delete(k) : state.fields.add(k); renderFieldChips(); reset(); }));
}
const DATES = [["7","近 7 天"],["30","近 30 天"],["90","近 3 个月"],["365","近 1 年"],["all","全部（" + "2020 至今）"]];
function renderDateChips(){
  const row = $("dateRow"); row.querySelectorAll(".chip").forEach(c => c.remove());
  const sel = $("month");
  for (const [k, v] of DATES)
    row.insertBefore(chip(v, state.date === k && !state.month, () => { state.date = k; store.set("lr-date", k); state.month = ""; sel.value = ""; renderDateChips(); reset(); }), sel);
}
function fillSelects(){
  if (DB.on) return;
  const mc = {};
  for (const g of scopeGroups()) for (const [m, n] of Object.entries((META && META.shards[g]) || {})) mc[m] = (mc[m] || 0) + n;
  const ms = $("month"); ms.replaceChildren(new Option("按年 / 月", ""));
  const years = [...new Set(Object.keys(mc).map(m => m.slice(0, 4)))].sort().reverse();
  for (const y of years){
    const og = document.createElement("optgroup"); og.label = y + " 年";
    const ym = Object.keys(mc).filter(m => m.startsWith(y)).sort().reverse();
    og.append(new Option(y + " 全年（" + ym.reduce((t, m) => t + mc[m], 0) + "）", y));
    for (const m of ym) og.append(new Option(m.replace("-", " 年 ") + " 月（" + mc[m] + "）", m));
    ms.append(og);
  }
  ms.value = state.month && [...ms.options].some(o => o.value === state.month) ? state.month : "";
  const scope = new Set(scopeFields()); const vis = ALL.filter(p => inScope(p, scope));
  const cnt = {}; for (const p of vis) cnt[p.journal] = (cnt[p.journal] || 0) + 1;
  const js = $("journal"); const jv = js.value; js.length = 1;
  for (const j of Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])){
    const info = JOURNALS[j] || {}; const extra = [info.cas_zone, info.if != null ? "IF " + info.if : ""].filter(Boolean).join(" · ");
    js.append(new Option(j + "（" + cnt[j] + (extra ? "，" + extra : "") + "）", j));
  }
  if (jv && cnt[jv]) js.value = jv;
  const ic = {}; for (const p of vis) for (const a of p.affils || []) ic[a] = (ic[a] || 0) + 1;
  const dl = $("instList"); dl.replaceChildren();
  for (const a of Object.keys(ic).sort((x, y) => ic[y] - ic[x]).slice(0, 400)) { const o = document.createElement("option"); o.value = a; o.label = ic[a] + " 篇"; dl.append(o); }
}
function bindToggle(id, key){ $(id).addEventListener("click", () => { state[key] = !state[key]; $(id).setAttribute("aria-pressed", String(state[key])); reset(); }); }
bindToggle("keyonly", "key"); bindToggle("staronly", "star"); bindToggle("unreadonly", "unread");
$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); reset(); });
$("inst").addEventListener("input", e => { state.inst = e.target.value.trim().toLowerCase(); reset(); });
$("journal").addEventListener("change", e => { state.journal = e.target.value; reset(); });
$("zone").addEventListener("change", e => { state.zone = e.target.value; reset(); });
$("scope").addEventListener("change", e => { state.scope = e.target.value; if (state.scope !== "mine") store.set("lr-scope", state.scope); state.fields.clear(); renderFieldChips(); reset(); });
$("month").addEventListener("change", e => { state.month = e.target.value; renderDateChips(); reset(); });
$("reset").addEventListener("click", () => {

const VIEWS = { card: "vCard", list: "vList", trend: "vTrend", graph: "vGraph" };
function setView(v){

const narrow = matchMedia("(max-width:900px)");
function setCollapsed(c){ store.set("lr-collapsed", c); $("layout").classList.toggle("collapsed", c); $("openSide").setAttribute("aria-expanded", String(!c)); }

/* ---------- data loading (group / month shards) ---------- */
function getJSON(u, ver){
  // shards carry a content hash, so the browser may cache them; meta.json is revalidated every 5 minutes
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 45000);
  return fetch(u + (ver ? "?v=" + ver : "?t=" + Math.floor(Date.now() / 300000)), ver ? { signal: c.signal } : { cache: "no-cache", signal: c.signal })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).finally(() => clearTimeout(t));
}
const PUB = [["10.1016/j.joule", "Cell Press"], ["10.1016", "ScienceDirect"], ["10.1038", "Nature"], ["10.1021", "ACS Publications"], ["10.1002", "Wiley Online Library"],
  ["10.1039", "RSC Publishing"], ["10.1126", "Science"], ["10.5194", "Copernicus"], ["10.1029", "AGU"], ["10.1007", "Springer"]];
function pidOf(doi){ return String(doi || "").toLowerCase().replace(/[^a-z0-9_.~:@+-]/g, "_"); }
function decodeShard(j){
  if (!j || j.v !== 3) return (j && j.papers) || [];
  const map = (arr, t) => arr && arr.map(i => t[i]);
  return (j.papers || []).map(p => ({ ...p, id: pidOf(p.doi), j: j.J[p.j], a: map(p.a, j.I), c: map(p.c, j.I), kw: map(p.kw, j.K), kwz: j.KZ ? map(p.kw, j.KZ) : null, tp: map(p.tp, j.T) }));
}
function expand(r){
  const doi = r.doi || ""; const url = doi ? "https://doi.org/" + doi : "";
  const src = r.src || ["官方", (PUB.find(([k]) => doi.startsWith(k)) || [0, "出版社"])[1], url];
  const m = marks[r.id] || {};
  return { _id: r.id, title: r.t, journal: r.j, fields: r.f || [], field: (r.f || [])[0], published: r.d, doi, url, summary_zh: r.s || "",
    key: !!r.k, affils: r.a, corr_affils: r.c, kw: r.kw || [], kwz: r.kwz || [], topic: r.tp, title_zh: r.tz || "", authors: r.au || [], author_count: r.an, hb: !!r.hb, source_type: src[0], source_name: src[1], source_url: src[2], added: r.x, starred: !!m.starred, read: !!m.read };
}
function neededShards(){
  if (!META) return [];

    const on = () => {

      edges.forEach((e, k) => { if (e.a === i || e.b === i) eEls[k].classList.add("on"); });
      const top = edges.filter(e => e.a === i || e.b === i).sort((x, y) => y.w - x.w).slice(0, 3).map(e => nodes[e.a === i ? e.b : e.a].label + " " + e.w);
      tip.hidden = false; tip.textContent = n.label + "：" + n.n.toLocaleString() + " 篇" + (top.length ? "｜常同现：" + top.join("、") : "");
      tip.style.left = (n.x / W * 100) + "%"; tip.style.top = ((n.y - n.r) / H * 100) + "%";
    };
    const off = () => { panel.classList.remove("focus"); for (const x of nEls) x.classList.remove("on"); for (const x of eEls) x.classList.remove("on"); tip.hidden = true; };
    g.addEventListener("mouseenter", on); g.addEventListener("mouseleave", off); g.addEventListener("focus", on); g.addEventListener("blur", off);
    const pick = () => {
      if (n.kind === "f"){ state.fields = new Set([n.f]); renderFieldChips(); }
      else if (graphKind === "inst"){ state.inst = n.k.toLowerCase(); $("inst").value = n.k; }
      else if (graphKind === "journal"){ const j = Object.keys(JOURNALS).find(x => abbrOf({ journal: x }) === n.k) || n.k; state.journal = j; $("journal").value = j; }
      else { $("q").value = n.k; state.q = n.k.toLowerCase(); }
      setView("card"); reset();
    };
    g.addEventListener("click", pick); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
    gN.append(g); return g;
  });
  const pairs = el("ol", "pairs");
  for (const e of [...edges].sort((x, y) => y.w - x.w).slice(0, 8)){ const li = el("li"); li.append(el("b", null, nodes[e.a].label + " — " + nodes[e.b].label), document.createTextNode("：共同出现 " + e.w + " 篇")); pairs.append(li); }
  const sub = (agg.total > sample.length ? "基于最新的 " + sample.length.toLocaleString() + " 篇。" : "") + (useTitle ? "关键词仍在补全，暂用标题中的高频词组。" : "");
  panel.append(el("h3", null, "雷达关联图"), el("p", "sub", "展示当前筛出文献中研究方向与" + { kw: "关键词", inst: "发表单位", journal: "期刊" }[graphKind] + "的共现关系。" + sub), bar, box, el("h3", null, "共现最多的组合"), pairs);
  wrap.append(panel); return wrap;
}

/* ---------- login dialog ---------- */
let mode = "login";
let phoneEnabled = null, smsBusy = false, sentPhone = "", resendAt = 0, resendTimer;
let dialogVersion = 0, socialBusy = false;
let expectedPhoneOwner = null, rejectedPhoneUser = null;

function rejectPhoneSession(userId){
  if (!userId || rejectedPhoneUser === userId) return;
  rejectedPhoneUser = userId;
  afterAuthChange(null);
  showNote("手机号验证返回了其他账户，已停止绑定。请用原方式重新登录。");
  // Release the Auth callback lock before querying or terminating this session.
  setTimeout(async () => {
    const { data } = await sb.auth.getSession();
    if (data.session?.user.id === userId) await sb.auth.signOut({ scope: "local" });
  }, 0);
}

async function refreshPhoneStatus(){
  if (!sb) return;
  try {
    const r = await fetch(CFG.supabaseUrl + "/auth/v1/settings", { headers: { apikey: CFG.supabaseAnonKey } });
    if (!r.ok) throw Error();
    const settings = await r.json();
    phoneEnabled = settings.external?.phone === true && settings.phone_autoconfirm === false;
  } catch { phoneEnabled = null; }
  renderMethods();
}
function renderMethods(){
  const linking = !!auth.user;
  $("loginMethods").hidden = !sb || !["login","register","profile"].includes(mode);
  const phone = $("phoneMethod"), boundPhone = linking && !!auth.user.phone_confirmed_at;
  phone.disabled = boundPhone || phoneEnabled !== true;
  phone.textContent = boundPhone ? "已绑定手机号" : (linking ? "绑定手机号" : "手机验证码") +
    (phoneEnabled === false ? "（待开通）" : phoneEnabled === null ? "（暂不可用）" : "");
  for (const [key, name] of [["wechat","微信"],["qq","QQ"]]){
    const provider = CFG.socialProviders?.[key], btn = $(key + "Method");
    const bound = !!provider && auth.user?.identities?.some(id => id.provider === provider);
    btn.disabled = !provider || bound || socialBusy;
    btn.textContent = bound ? "已绑定" + name : (linking ? "绑定" + name : (key === "wechat" ? "微信扫码" : "QQ 登录")) + (provider ? "" : "（待开通）");
  }
}
function updateSmsButton(){
  clearTimeout(resendTimer);
  const left = Math.max(0, Math.ceil((resendAt - Date.now()) / 1000));
  $("smsSend").disabled = smsBusy || left > 0;
  $("smsSend").textContent = left ? left + " 秒后可重发" : "获取验证码";
  if (left && mode === "phone" && !$("scrim").hidden) resendTimer = setTimeout(updateSmsButton, 1000);
}
function renderLogin(){
  const n = who(); const b = $("loginBtn");
  b.disabled = auth.loading;
  if (cloudConfigured && !sb) {
    b.textContent = "登录暂不可用"; b.title = "账户服务未能连接，请刷新页面重试"; return;
  }
  if (!cloudConfigured) {
    b.textContent = n ? "本机档案 · " + n : "本机档案"; b.title = "在当前浏览器保存阅读偏好"; return;
  }
  b.textContent = auth.loading ? "正在加载账户…" : n ? "账户 · " + n : "登录 / 注册";
  b.title = n ? "管理登录方式和关注方向" : "登录或注册个人账户";
}
function fieldChecks(selected){
  const box = $("ufields"); box.replaceChildren();
  for (const g of GROUPS){
    const sec = el("div", "fgroup"); sec.append(el("div", "glab", g.name));
    const cks = el("div", "checks");
    for (const k of g.fields) if (FIELDS[k]){
      const lab = el("label"); const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = k; cb.checked = selected.includes(k);
      lab.append(cb, document.createTextNode(FIELDS[k])); cks.append(lab);
    }
    sec.append(cks); box.append(sec);
  }
}
function chosenFields(){ return [...$("ufields").querySelectorAll("input:checked")].map(c => c.value); }
function setMode(m){
  dialogVersion++; mode = m; $("msg").textContent = "";
  sentPhone = ""; $("smsCode").value = ""; $("smsPhone").value = "";
  $("smsForm").hidden = m !== "phone";
  if (m === "phone") updateSmsButton();
  renderMethods();
  const cloud = !!sb;
  $("authTabs").hidden = !(cloud && !auth.user);
  $("tLogin").setAttribute("aria-pressed", String(m === "login")); $("tReg").setAttribute("aria-pressed", String(m === "register"));
  $("lEmail").hidden = $("lPass").hidden = !(m === "login" || m === "register");
  $("lName").hidden = !(m === "register" || m === "profile" || m === "local");
  $("lFields").hidden = !(m === "register" || m === "profile" || m === "local");
  $("profiles").hidden = m !== "local";
  $("logout").hidden = !(m === "profile" || (m === "local" && localCurrent));
  $("pass").autocomplete = m === "register" ? "new-password" : "current-password";
  const titles = { login: "登录", register: "注册账户", profile: "我的账户", local: "本机档案", phone: auth.user ? "绑定手机号" : "手机验证码登录" };
  $("dlgTitle").textContent = titles[m];
  $("save").textContent = { login: "登录", register: "注册", profile: "保存", local: "保存本机档案", phone: auth.user ? "确认绑定" : "验证并登录" }[m];
  $("logout").textContent = m === "local" ? "退出本机档案" : "退出登录";
  $("dlgIntro").textContent = {
    login: "用注册时的邮箱和密码登录。已有账户的用户请先登录，再绑定其他登录方式，以保留原有收藏。",
    register: "选择你关注的研究方向，登录后默认只显示这些方向。",
    profile: (auth.user?.email ? auth.user.email + " · " : "") + "选择研究方向，也可以为当前账户绑定其他登录方式。",
    phone: auth.user ? "验证手机号后，可用它登录当前账户。" : "首次验证将创建账户。已有账户？请先用原方式登录，再绑定手机号。",
    local: "云端账户尚未开通。昵称、关注方向和收藏仅保存在当前浏览器。"
  }[m];
  if (m === "register") { $("uname").value = ""; fieldChecks([]); }
  if (m === "profile") { $("uname").value = auth.profile?.nickname || ""; fieldChecks(myFields()); }
  if (m === "local") {
    $("uname").value = localCurrent || ""; fieldChecks(localCurrent ? myFields() : (GROUPS.find(g => g.default) || GROUPS[0]).fields);
    const pf = $("profiles"); pf.replaceChildren();
    for (const n of Object.keys(localUsers)) pf.append(chip(n, n === localCurrent, () => { $("uname").value = n; fieldChecks(localUsers[n].fields); }));
  }
}
function openLogin(){
  if (cloudConfigured && !sb) { showNote("账户服务暂不可用，请刷新后重试。"); return; }
  setMode(sb ? (auth.user ? "profile" : "login") : "local"); $("scrim").hidden = false;
  refreshPhoneStatus();
  ($("email").offsetParent ? $("email") : $("uname")).focus();
}
function closeLogin(){ dialogVersion++; clearTimeout(resendTimer); sentPhone = ""; $("smsCode").value = ""; $("smsPhone").value = ""; $("scrim").hidden = true; $("pass").value = ""; $("email").value = ""; $("loginBtn").focus(); }
$("loginBtn").addEventListener("click", openLogin);
$("tLogin").addEventListener("click", () => setMode("login"));
$("tReg").addEventListener("click", () => setMode("register"));
$("phoneMethod").addEventListener("click", () => { if (phoneEnabled === true) { setMode("phone"); $("smsPhone").focus(); } });
for (const key of ["wechat","qq"]) $(key + "Method").addEventListener("click", async () => {
  const provider = CFG.socialProviders?.[key], version = dialogVersion;
  if (!provider || socialBusy) return;
  socialBusy = true; renderMethods();
  try {
    const { error } = await window.LR_SOCIAL.start(sb, provider, !!auth.user);
    if (error) throw error;
  } catch (e) { if (version === dialogVersion) $("msg").textContent = "授权未完成，请重试。" + (e.message || ""); }
  finally { socialBusy = false; renderMethods(); }
});
$("smsSend").addEventListener("click", async () => {
  if (mode !== "phone" || phoneEnabled !== true || smsBusy || Date.now() < resendAt) return;
  const version = dialogVersion, phone = window.LR_PHONE.normalize($("smsPhone").value);
  if (!phone) { $("msg").textContent = "请输入有效的中国大陆手机号。"; return; }
  smsBusy = true; updateSmsButton();
  try {
    const send = auth.user ? window.LR_PHONE.sendBinding : window.LR_PHONE.send;
    const { error } = await send(sb, phone);
    if (error) throw error;
    resendAt = Date.now() + 60000;
    if (version !== dialogVersion) return;
    sentPhone = phone; $("msg").textContent = "请查看手机短信并输入验证码。"; $("smsCode").focus();
  } catch (e) { if (version === dialogVersion) $("msg").textContent = "发送失败。" + (e.message || "请稍后重试。"); }
  finally { smsBusy = false; updateSmsButton(); }
});
$("cancel").addEventListener("click", closeLogin);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeLogin(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeLogin(); });
const ERR = { "Invalid login credentials": "邮箱或密码不正确", "Email not confirmed": "邮箱还没有验证，请先点击验证邮件里的链接", "User already registered": "这个邮箱已经注册过，请直接登录" };
$("save").addEventListener("click", async () => {
  const msg = $("msg"), btn = $("save"); msg.textContent = "";
  const email = $("email").value.trim(), pass = $("pass").value, name = $("uname").value.trim(), fields = chosenFields();
  try {
    btn.disabled = true;
    if (mode === "login"){
      if (!email || !pass) { msg.textContent = "请填写邮箱和密码"; return; }
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { msg.textContent = ERR[error.message] || error.message; return; }
      closeLogin();
    } else if (mode === "register"){
      if (!email || pass.length < 6) { msg.textContent = "请填写邮箱，密码至少 6 位"; return; }
      if (!fields.length) { msg.textContent = "请至少选择一个关注方向"; return; }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: {
        emailRedirectTo: new URL("./", location.href).href, data: { nickname: name || email.split("@")[0], fields }
      } });
      if (error) { msg.textContent = ERR[error.message] || error.message; return; }
      if (!data.session) { setMode("login"); $("pass").value = ""; msg.textContent = "请查看验证邮件，点击链接完成注册。已验证的账户可直接登录。"; return; }
      closeLogin();
    } else if (mode === "phone"){
      const phone = window.LR_PHONE.normalize($("smsPhone").value), code = $("smsCode").value.trim();
      if (!phone || phone !== sentPhone) { msg.textContent = "请先为当前手机号获取验证码。"; return; }
      if (!/^\d{6,10}$/.test(code)) { msg.textContent = "请输入短信中的数字验证码。"; return; }
      const binding = !!auth.user, userId = auth.user?.id, version = dialogVersion;
      const verify = binding ? window.LR_PHONE.verifyBinding : window.LR_PHONE.verify;
      expectedPhoneOwner = binding ? userId : null;
      let result;
      try { result = await verify(sb, phone, code); }
      finally { expectedPhoneOwner = null; }
      const { data, error } = result;
      if (binding && data?.user && data.user.id !== userId) { rejectPhoneSession(data.user.id); return; }
      if (version !== dialogVersion) return;
      if (error) { msg.textContent = "验证失败。" + error.message; return; }
      if (binding && !data?.user) { msg.textContent = "绑定状态未确认，请重新登录查看。"; return; }
      if (binding) { auth.user = data.user; setMode("profile"); msg.textContent = "手机号已绑定。"; }
      else closeLogin();
    } else if (mode === "profile"){
      if (!fields.length) { msg.textContent = "请至少选择一个关注方向"; return; }
      const version = accountVersion;
      const prof = { id: auth.user.id, nickname: name || auth.profile?.nickname || defaultName(auth.user), fields, updated_at: new Date().toISOString() };
      const { error } = await sb.from("profiles").upsert(prof);
      if (version !== accountVersion) return;
      if (error) { msg.textContent = "保存失败：" + error.message; return; }
      auth.profile = { nickname: prof.nickname, fields }; closeLogin(); state.scope = "mine"; renderLogin(); renderScope(); reset();
    } else {
      if (!name) { msg.textContent = "请先填写昵称"; $("uname").focus(); return; }
      localUsers[name] = { fields: fields.length ? fields : (GROUPS.find(g => g.default) || GROUPS[0]).fields };
      store.set("lr-users", localUsers); localCurrent = name; store.set("lr-current", name); closeLogin(); afterAuthChange();
    }
  } catch { msg.textContent = "账户服务未响应，请检查网络后重试。"; }
  finally { btn.disabled = false; }
});
$("logout").addEventListener("click", async () => {
  if (sb) {
    try {
      const { error } = await sb.auth.signOut({ scope: "local" });
      if (error) { $("msg").textContent = "退出失败，请重试。"; return; }
    } catch { $("msg").textContent = "退出失败，请检查网络后重试。"; return; }
  } else { localCurrent = null; store.set("lr-current", null); afterAuthChange(); }
  closeLogin();
});

/* ---------- theme ---------- */
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  store.set("lr-theme", t);
  for (const b of $("themeSeg").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.t === t));
}
applyTheme(store.get("lr-theme", "system"));
$("themeSeg").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (b) applyTheme(b.dataset.t); });

/* ---------- feedback ---------- */
let fbPaper = null;
function fbBody(){
  const lines = ["类型：" + $("fbType").value];
  if (fbPaper) lines.push("文献：" + fbPaper.title + "（DOI " + fbPaper.doi + "，当前分类：" + (FIELDS[fbPaper.field] || fbPaper.field) + "）");
  lines.push("", $("fbText").value.trim());
  if ($("fbContact").value.trim()) lines.push("", "联系方式：" + $("fbContact").value.trim());
  return lines.join("\n");
}
function openFeedback(p){
  fbPaper = p || null;
  $("fbType").value = p ? "文献纠错" : "功能建议";
  $("fbPaper").hidden = !p; $("fbPaper").textContent = p ? "文献：" + p.title + "（" + abbrOf(p) + "，当前分类：" + (FIELDS[p.field] || p.field) + "）" : "";
  $("fbText").value = ""; $("fbContact").value = ""; $("fbMsg").textContent = "";
  const cloud = !!sb;
  $("fbSend").hidden = !cloud; $("fbCopy").hidden = cloud; $("fbGh").hidden = cloud;
  $("fbIntro").textContent = cloud ? (auth.user ? "反馈将关联当前账户并发送给维护者。" : "本次反馈将以访客身份发送给维护者。") :
    "可复制反馈并私下发给维护者，也可单独新建公开 GitHub Issue。";
  $("fbScrim").hidden = false; $("fbText").focus();
}
function closeFeedback(){ $("fbScrim").hidden = true; }
$("fbBtn").addEventListener("click", () => openFeedback(null));
$("fbCancel").addEventListener("click", closeFeedback);
$("fbScrim").addEventListener("click", e => { if (e.target === $("fbScrim")) closeFeedback(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("fbScrim").hidden) closeFeedback(); });
$("fbCopy").addEventListener("click", async () => {
  if (!$("fbText").value.trim()) { $("fbMsg").textContent = "请先填写内容"; return; }
  try { await navigator.clipboard.writeText(fbBody()); $("fbMsg").textContent = "已复制，可以粘贴发给维护者。"; }
  catch { $("fbText").select(); $("fbMsg").textContent = "复制失败，请手动选中内容复制。"; }
});
$("fbSend").addEventListener("click", async () => {
  const content = $("fbText").value.trim(); if (!content) { $("fbMsg").textContent = "请先填写内容"; $("fbText").focus(); return; }
  if (auth.loading && !auth.user) { $("fbMsg").textContent = "正在确认登录状态，请稍后重试。"; return; }
  const version = accountVersion;
  $("fbSend").disabled = true;
  try {
    const { error } = await sb.from("feedback").insert({ type: $("fbType").value, content, contact: $("fbContact").value.trim() || null,
      paper_id: fbPaper ? fbPaper._id : null, page_url: location.origin + location.pathname, user_id: auth.user?.id || null });
    if (version !== accountVersion) return;
    if (error) { $("fbMsg").textContent = "提交失败：" + error.message; return; }
    closeFeedback(); showNote("反馈已提交，谢谢！");
  } catch { $("fbMsg").textContent = "提交失败，请检查网络后重试。"; }
  finally { $("fbSend").disabled = false; }
});

/* ---------- boot ---------- */
renderLogin(); renderDateChips(); renderSort(); setView(state.view);
if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    const user = session?.user || null;
    if (user && (user.id === rejectedPhoneUser || (expectedPhoneOwner && user.id !== expectedPhoneOwner))) {
      rejectPhoneSession(user.id); return;
    }
    if (!user) rejectedPhoneUser = null;
    if (event === "INITIAL_SESSION" || user?.id !== auth.user?.id) afterAuthChange(user);
    else if (user) { auth.user = user; renderMethods(); }
  });
} else afterAuthChange();
(async () => {
  try {
    let j = null;
    for (const u of SOURCES) { try { const x = await getJSON(u + "meta.json"); if (x && x.shards) { j = x; BASE = u; break; } } catch {} }
    if (!j) throw new Error("no source");
    META = j; FIELDS = j.fields || DEFAULT_FIELDS; JOURNALS = j.journals || {};
    if (Array.isArray(j.groups) && j.groups.length) GROUPS = j.groups;
    const age = j.updated ? (Date.now() - new Date(j.updated.replace(" ", "T") + ":00+08:00")) / 36e5 : 0;
    if (age > 9) showNote("提示：数据最近一次更新是 " + j.updated + "，距今约 " + Math.round(age) + " 小时，自动更新可能延迟了，稍后会自动补上。");
    else if (j.updated) showNote("数据更新于 " + j.updated + "，库内共 " + (j.total || 0).toLocaleString() + " 篇（" + (j.since || "2020-01").slice(0, 4) + " 年至今）。影响因子为 JCR 2025 年发布值，分区为中科院 2025 年版（大类）。");
  } catch (e) {
    showNote("文献数据暂时加载失败，请检查网络后刷新页面。");
  }
  if (authReturnError) showNote(authReturnError);
  DB.on = await probeDB();
  if (DB.on) showNote(($("note").textContent ? $("note").textContent + " " : "") + "已启用全库检索：搜索与筛选直接查询服务器上的全部文献。");
  state.loaded = true; renderScope(); fillSelects(); ensureData(); if (DB.on) render();
  if (!$("scrim").hidden && !$("lFields").hidden) fieldChecks(chosenFields());
  renderAccount();
})();
